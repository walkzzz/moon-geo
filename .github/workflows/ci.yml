name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Check
        run: moon check
      - name: Test
        run: moon test
      - name: Format check
        run: moon fmt --check
      - name: Interface drift check
        run: moon info --check
      - name: CRAP report
        run: bash tools/crap_report.sh
      - name: Mutation test
        run: bash tools/mutation_test.sh
